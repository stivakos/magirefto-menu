name: Τελείωσε (tablet)

# Το καλεί η σελίδα /tablet/ του μαγαζιού με ΕΝΑ αίτημα, όποτε πατηθεί πιάτο:
#
#   POST /repos/stivakos/magirefto-menu/actions/workflows/soldout.yml/dispatches
#   {"ref":"main","inputs":{"date":"2026-09-14","items":"menu-hmeras:8,synodeytika:2",
#                           "few":"menu-hmeras:16=2"}}
#
# Γράφει ΜΟΝΟ το soldout.json. Δεν ξαναχτίζει το site — η σελίδα το διαβάζει
# όταν ανοίγει — άρα δεν αγγίζει index.html, social ή έγκριση δημοσίευσης, και
# δεν μπορεί να συγκρουστεί με ένα build μενού που τρέχει την ίδια ώρα.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Ημερομηνία μενού (ISO, όπως στο menu.json)"
        required: true
        type: string
      items:
        description: "Τι τελείωσε: slug:aa με κόμμα — κενό = όλα διαθέσιμα"
        required: false
        type: string
        default: ""
      few:
        description: "Τελευταίες μερίδες: slug:aa=2 ή =1 με κόμμα"
        required: false
        type: string
        default: ""

permissions:
  contents: write

# Ένα τη φορά. Αν περιμένουν δύο, το GitHub κρατά μόνο το νεότερο — σωστό,
# αφού κάθε αίτημα κουβαλά ολόκληρη τη λίστα του tablet.
concurrency:
  group: soldout
  cancel-in-progress: false

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ΟΧΙ το SHA του αιτήματος: με γρήγορα πατήματα αυτό είναι πριν από το
          # push της προηγούμενης εκτέλεσης.
          ref: main
      - name: Γράψιμο soldout.json και commit
        # Οι είσοδοι περνούν ως μεταβλητές, ΠΟΤΕ μέσα στο script: αλλιώς ένα
        # κείμενο από το αίτημα θα εκτελούνταν ως εντολή.
        env:
          DATE: ${{ inputs.date }}
          ITEMS: ${{ inputs.items }}
          FEW: ${{ inputs.few }}
          COMMIT_MSG_FILE: ${{ runner.temp }}/msg.txt
        run: |
          git config user.name "merci-menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Αν το push απορριφθεί (πρόλαβε άλλο commit), ΔΕΝ κάνουμε rebase: δύο
          # εκδοχές του soldout.json συγκρούονται. Το αρχείο βγαίνει ολόκληρο από
          # την είσοδο, οπότε απλώς το ξαναγράφουμε πάνω στο τελευταίο main.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 build-source/soldout.py --date "$DATE" --items "$ITEMS" --few "$FEW"
            git add soldout.json
            if git diff --cached --quiet; then
              echo "Δεν άλλαξε κάτι."
              exit 0
            fi
            git commit -q -F "$COMMIT_MSG_FILE"
            git push -q origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
