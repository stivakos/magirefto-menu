name: Build menu

# Ξαναχτίζει το index.html όποτε αλλάζει το μενού της ημέρας ή η βάση πιάτων,
# και το δημοσιεύει (GitHub Pages). Ο ιδιοκτήτης απλώς επεξεργάζεται το
# menu-today.txt (ακόμη κι από το κινητό μέσω GitHub) και πατά Commit.

on:
  push:
    branches: [main]
    paths:
      - "menu-today.txt"
      - "soldout.txt"
      - "DAILY_MENU.xlsx"
      - "build-source/**"
  workflow_dispatch:
  # Καλείται και από το soldout.yml: το GitHub ΔΕΝ πυροδοτεί workflows από
  # pushes που κάνει το ίδιο (προστασία από ατέρμονο βρόχο), οπότε το commit
  # του «τελείωσε» δεν θα ξαναέχτιζε ποτέ τη σελίδα μόνο του.
  workflow_call:

permissions:
  contents: write

concurrency:
  group: build-menu
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ref: main γιατί όταν μας καλεί το soldout.yml, το SHA του συμβάντος
      # είναι ΠΡΙΝ από το commit της σήμανσης.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl pillow
      # ΠΡΙΝ τον έλεγχο: αν άλλαξε η μέρα, τα χθεσινά «τελείωσε» πρέπει να
      # έχουν φύγει ήδη, αλλιώς ο έλεγχος θα γκρίνιαζε για δική μας εκκρεμότητα.
      - name: Καθάρισμα «τελείωσαν» αν άλλαξε η μέρα
        working-directory: build-source
        run: python soldout.py --reset
      - name: Έλεγχος μενού (σταματά πριν δημοσιευτεί λάθος)
        working-directory: build-source
        run: python check.py
      - name: Build index.html
        working-directory: build-source
        run: python build.py

      # --- εικόνα για τα social -------------------------------------------
      # Χωριστό βήμα ΜΕΤΑ το build: αν σκάσει ο Chrome, το site έχει ήδη χτιστεί.
      - name: Εικόνα μαυροπίνακα
        working-directory: build-source
        run: python social.py
      - name: Προεπισκόπηση σε orphan branch
        # Δεν μπαίνει στο main: το git κρατά κάθε έκδοση και θα φούσκωνε ~75 MB
        # τον χρόνο. Με force-push το branch έχει πάντα ΕΝΑ commit.
        run: |
          tmp=$(mktemp -d)
          cp social/menu.jpg "$tmp/menu.jpg"
          # η ταυτότητα ταξιδεύει ΜΑΖΙ με την εικόνα: το publish.py τη διαβάζει
          # για να μη στείλει ποτέ εικόνα άλλης μέρας
          cp social/menu.json "$tmp/menu.json"
          cd "$tmp"
          git init -q -b social-preview
          git config user.name "merci-menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.jpg menu.json
          git commit -q -m "Προεπισκόπηση $(date -u +%F\ %H:%M) UTC"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            social-preview
      - name: Μηδενισμός έγκρισης δημοσίευσης
        working-directory: build-source
        run: python publish.py --reset

      - name: Commit index.html + ΠΙΑΤΑ.md + post.txt
        run: |
          git config user.name "merci-menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ΠΙΑΤΑ.md post.txt soldout.txt menu-state.json
          if git diff --cached --quiet; then
            echo "Δεν άλλαξε κάτι."
          else
            # [skip ci] ώστε να μην πυροδοτηθεί το publish-social από το reset
            git commit -m "Auto-rebuild μενού ημέρας [skip ci]"
            git push
          fi
