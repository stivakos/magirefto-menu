name: Μενού — προσχέδιο σε issue

# Ανοίγεις issue, κουβεντιάζεις σε σχόλια, γράφεις «στείλε». Τίποτα δεν
# δημοσιεύεται πριν από αυτό — ούτε φωτογραφία, ούτε τέλεια λίστα με την πρώτη.
#
#   φωτογραφία μαυροπίνακα   -> το μοντέλο τη διαβάζει  -> προσχέδιο για ΣΗΜΕΡΑ
#   κείμενο με κόμματα       -> κανένα μοντέλο          -> προσχέδιο για ΑΥΡΙΟ
#   «στείλε»                 -> γράφει το menu-today.txt, build, κλείσιμο
#   «βγάλε <πιάτο>» / «ακύρωση»
#
# Η ΚΑΤΑΣΤΑΣΗ ΖΕΙ ΣΕ ΕΝΑ ΣΧΟΛΙΟ, όχι σε αρχείο του repo: το job βρίσκει το δικό
# του σχόλιο-προσχέδιο (κρυφός δείκτης MENU-STATE), διαβάζει από εκεί πού είχε
# μείνει, και το ΕΠΕΞΕΡΓΑΖΕΤΑΙ. Έτσι το git δεν γεμίζει commit ανά διόρθωση, και
# — το σοβαρό — η φωτογραφία διαβάζεται ΜΙΑ φορά αντί για μία ανά σχόλιο.
#
# Η φωτό δεν μπαίνει ποτέ σε git: 2-4 MB × 250 μέρες = μισό γίγα τον χρόνο. Τα
# συνημμένα των issues ζουν στο CDN του GitHub.
#
# Προσοχή: ΚΑΘΕ σχόλιο του ιδιοκτήτη διαβάζεται ως γύρος. Ένα «ευχαριστώ» θα
# εμφανιστεί ως εκκρεμότητα — άκακο, το προσχέδιο δεν πειράζεται.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write        # commit του menu-today.txt
  issues: write          # σχόλια, επεξεργασία, κλείσιμο
  actions: write         # πυροδότηση του «Build menu»

concurrency:
  group: board-photo     # σειριακά: δύο γύροι μαζί θα πατούσαν ο ένας τον άλλο
  cancel-in-progress: false

jobs:
  round:
    # ΜΟΝΟ ο ιδιοκτήτης. Στο σχόλιο ελέγχεται ο συγγραφέας ΤΟΥ ΣΧΟΛΙΟΥ, όχι του
    # issue: αλλιώς αρκεί ένα δικό μου issue για να γράφει μενού οποιοσδήποτε.
    # Ο έλεγχος για Bot κρατά έξω τα ίδια τα σχόλια της ροής.
    if: >-
      (github.event_name == 'issues'
      && github.event.issue.author_association == 'OWNER')
      || (github.event_name == 'issue_comment'
      && github.event.comment.author_association == 'OWNER'
      && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl anthropic

      - name: Το κείμενο του γύρου
        id: input
        env:
          # Και τα δύο ως μεταβλητές, και η επιλογή στο bash: το «A && B || C»
          # των expressions πέφτει στο C όταν το B είναι κενό, δηλαδή άδειο
          # σχόλιο θα ξαναδιάβαζε το σώμα του issue σαν να ήταν νέος γύρος.
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "issue_comment" ]; then
            printf '%s' "$COMMENT_BODY" > body.txt
          else
            printf '%s' "$ISSUE_BODY" > body.txt
          fi
          # ![alt](url)  ή  <img src="url">
          url=$(grep -oE 'https://[^)" ]+(user-attachments|githubusercontent)[^)" ]*' \
                body.txt | head -1 || true)
          if [ -n "$url" ]; then
            curl -sSL --max-time 120 -o menu-photo.jpg "$url"
            file menu-photo.jpg
            echo "photo=1" >> "$GITHUB_OUTPUT"
          else
            echo "photo=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Πού είχαμε μείνει
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event.issue.number }}"
          # Το τελευταίο σχόλιο της ροής που κουβαλά τον δείκτη κατάστασης.
          gh api "repos/${{ github.repository }}/issues/$n/comments" --paginate \
            --jq '[.[] | select(.user.type == "Bot")
                       | select(.body | contains("MENU-STATE"))] | last // empty' \
            > prev.json
          if [ -s prev.json ]; then
            jq -r '.id' prev.json > draft_id.txt
            jq -r '.body' prev.json \
              | sed -n 's/.*<!-- MENU-STATE \(.*\) -->.*/\1/p' > state.json
            echo "id=$(cat draft_id.txt)" >> "$GITHUB_OUTPUT"
            echo "Συνεχίζω από το σχόλιο $(cat draft_id.txt)"
          else
            echo "Νέο προσχέδιο."
          fi
          [ -s state.json ] || echo '{}' > state.json

      - name: Ο γύρος
        id: round
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          args="--state ../state.json --body ../body.txt
                --draft-out ../draft.md --reply-out ../reply.md
                --state-out ../state.json"
          [ "${{ steps.input.outputs.photo }}" = "1" ] && args="$args --photo ../menu-photo.jpg"
          out=$(cd build-source && python menu_draft.py $args 2>&1)
          code=$?
          echo "$out"
          # ΜΟΝΟ η τελευταία γραμμή: σε σφάλμα το $out είναι πολυγραμμικό και θα
          # χάλαγε το GITHUB_OUTPUT, που είναι key=value ανά γραμμή.
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "mode=$(printf '%s' "$out" | tail -1)" >> "$GITHUB_OUTPUT"
          # Σφάλμα => το λέμε στο issue αντί να πεθάνει σιωπηλά το job.
          [ $code -eq 0 ] || printf 'Κάτι πήγε στραβά:\n\n```\n%s\n```\n' "$out" > draft.md

      - name: Το σχόλιο-προσχέδιο
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event.issue.number }}"
          id="${{ steps.prev.outputs.id }}"
          if [ -n "$id" ]; then
            jq -Rs '{body: .}' < draft.md \
              | gh api --method PATCH \
                  "repos/${{ github.repository }}/issues/comments/$id" --input -
          else
            gh issue comment "$n" --body-file draft.md
          fi
          [ "${{ steps.round.outputs.code }}" = "0" ] || exit 1

      - name: Commit του μενού
        if: steps.round.outputs.mode == 'published'
        run: |
          git config user.name "merci-menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Το reply.md ΔΕΝ σβήνεται εδώ — το χρειάζεται η ανακοίνωση παρακάτω.
          rm -f menu-photo.jpg body.txt draft.md prev.json draft_id.txt
          git add menu-today.txt
          if git diff --cached --quiet; then
            echo "Το μενού ήταν ήδη έτσι."
          else
            git commit -m "Μενού από προσχέδιο issue (#${{ github.event.issue.number }})"
            git push
          fi

      # Το build ΔΕΝ ξεκινά μόνο του: τα push του GITHUB_TOKEN δεν πυροδοτούν
      # workflows (προστασία από ατέρμονο βρόχο). Το καλούμε ρητά.
      - name: Ξεκίνα το build
        if: steps.round.outputs.mode == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Build menu"

      - name: Ανακοίνωση και κλείσιμο
        if: steps.round.outputs.mode == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event.issue.number }}"
          gh issue comment "$n" --body-file reply.md
          # Σε επαναδημοσίευση το issue είναι ήδη κλειστό — δεν είναι σφάλμα.
          gh issue close "$n" 2>/dev/null || true
