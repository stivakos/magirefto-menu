name: Μενού από φωτογραφία ή κείμενο

# Ανοίγεις issue -> το μενού ενημερώνεται. Δύο τρόποι, ίδιος προορισμός:
#
#   φωτογραφία μαυροπίνακα  -> το μοντέλο τη διαβάζει  -> μενού για ΣΗΜΕΡΑ
#   σκέτο κείμενο με κόμματα -> κανένα μοντέλο         -> μενού για ΑΥΡΙΟ
#
# Το κείμενο είναι για το βράδυ, όταν ετοιμάζεις την επόμενη μέρα και ο πίνακας
# δεν έχει γραφτεί ακόμα. Μελλοντική ημερομηνία δεν κλειδώνει τη σελίδα — το
# `.stale` μπαίνει μόνο για ημερομηνία παλιότερη από σήμερα.
#
# Γιατί issue και όχι αρχείο στο repo: το git κρατά ΚΑΘΕ έκδοση. Μια φωτό
# κινητού είναι 2-4 MB· 250 μέρες τον χρόνο = μισό γίγα σε repo που σήμερα
# είναι 3 MB. Τα συνημμένα των issues ζουν στο CDN του GitHub, εκτός git.
#
# Μπόνους: το ίδιο το issue γίνεται το αποδεικτικό — γράφεται από κάτω τι
# διαβάστηκε, και το βλέπεις από το κινητό.
#
# ΔΙΟΡΘΩΣΗ: σχολιάζεις στο ΙΔΙΟ issue τη σωστή λίστα (ή νέα φωτό) και ξανατρέχει,
# διαβάζοντας το σχόλιο αντί για το σώμα. Δουλεύει και σε κλειστό issue — εκεί
# είναι που το χρειάζεσαι επειγόντως: ανέβηκε, βγήκε λάθος πιάτο, θες διόρθωση.
# Προσοχή: ΚΑΘΕ σχόλιο του ιδιοκτήτη διαβάζεται ως μενού. Ένα «ευχαριστώ» θα
# απαντηθεί με «δεν βρέθηκε πιάτο» — άκακο, αλλά θορυβώδες.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write        # commit του menu-today.txt
  issues: write          # απάντηση και κλείσιμο
  actions: write         # πυροδότηση του «Build menu»

concurrency:
  group: board-photo
  cancel-in-progress: false

jobs:
  read:
    # ΜΟΝΟ ο ιδιοκτήτης του repo. Χωρίς αυτό, οποιοσδήποτε περαστικός θα άλλαζε
    # το μενού του μαγαζιού ανοίγοντας ένα issue με μια φωτογραφία.
    #
    # Στο σχόλιο ελέγχεται ο συγγραφέας ΤΟΥ ΣΧΟΛΙΟΥ, όχι του issue: αλλιώς αρκεί
    # ένα δικό μου issue για να γράφει μενού οποιοσδήποτε από κάτω.
    #
    # Ο έλεγχος για Bot κρατά έξω τα ίδια τα σχόλια της ροής («διάβασα αυτά…»).
    # Τα events του GITHUB_TOKEN ούτως ή άλλως δεν πυροδοτούν workflows — η ίδια
    # προστασία που αναγκάζει το ρητό «gh workflow run» πιο κάτω — αλλά ένας
    # ατέρμονος βρόχος που γράφει στο repo δεν αξίζει να στηρίζεται σε παρενέργεια.
    if: >-
      (github.event_name == 'issues'
      && github.event.issue.author_association == 'OWNER')
      || (github.event_name == 'issue_comment'
      && github.event.comment.author_association == 'OWNER'
      && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl anthropic

      - name: Φωτογραφία ή κείμενο;
        id: input
        env:
          # Και τα δύο ως μεταβλητές, και η επιλογή γίνεται στο bash: το
          # «A && B || C» των expressions πέφτει στο C όταν το B είναι κενό, που
          # εδώ σημαίνει «άδειο σχόλιο ⇒ ξαναδιάβασε το σώμα του issue» — δηλαδή
          # να ξαναγραφτεί σιωπηλά το παλιό μενού αντί να βγει σφάλμα.
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "issue_comment" ]; then
            BODY="$COMMENT_BODY"
          else
            BODY="$ISSUE_BODY"
          fi
          # ![alt](url)  ή  <img src="url">
          url=$(printf '%s' "$BODY" \
                | grep -oE 'https://[^)" ]+(user-attachments|githubusercontent)[^)" ]*' \
                | head -1)
          if [ -n "$url" ]; then
            curl -sSL --max-time 120 -o menu-photo.jpg "$url"
            file menu-photo.jpg
            echo "mode=photo" >> "$GITHUB_OUTPUT"
          else
            # Ό,τι έγραψες, όπως το έγραψες. Το read_board.py το χωρίζει σε
            # γραμμές και κόμματα — δεν μπαίνει μοντέλο στη μέση.
            printf '%s' "$BODY" > menu-text.txt
            echo "mode=text" >> "$GITHUB_OUTPUT"
          fi

      - name: Ανάγνωση
        id: read
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: build-source
        run: |
          set +e
          if [ "${{ steps.input.outputs.mode }}" = "text" ]; then
            python read_board.py --text ../menu-text.txt > ../result.txt 2>&1
          else
            python read_board.py ../menu-photo.jpg > ../result.txt 2>&1
          fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat ../result.txt

      - name: Απάντηση στο issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event.issue.number }}"
          { echo '```'; cat result.txt; echo '```'; } > comment.md
          gh issue comment "$n" --body-file comment.md
          [ "${{ steps.read.outputs.code }}" = "0" ] || exit 1

      - name: Commit του μενού
        run: |
          git config user.name "merci-menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f menu-photo.jpg menu-text.txt result.txt comment.md
          git add menu-today.txt
          if git diff --cached --quiet; then
            echo "Το μενού ήταν ήδη έτσι."
          else
            if [ "${{ steps.input.outputs.mode }}" = "text" ]; then
              why="Μενού επόμενης ημέρας από κείμενο"
            else
              why="Μενού ημέρας από φωτογραφία μαυροπίνακα"
            fi
            git commit -m "$why (#${{ github.event.issue.number }})"
            git push
          fi

      # Το build ΔΕΝ ξεκινά μόνο του: τα push του GITHUB_TOKEN δεν πυροδοτούν
      # workflows (προστασία από ατέρμονο βρόχο). Το καλούμε ρητά.
      - name: Ξεκίνα το build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Build menu"

      - name: Κλείσιμο του issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event.issue.number }}"
          # Το σχόλιο χωριστά από το κλείσιμο: σε διόρθωση μέσω σχολίου το issue
          # είναι συχνά ΗΔΗ κλειστό, και δεν θέλουμε η επιβεβαίωση να χαθεί μαζί
          # με ένα κλείσιμο που δεν είχε τι να κλείσει.
          gh issue comment "$n" --body "Το μενού ανέβηκε. Σε ένα λεπτό είναι στο site."
          gh issue close "$n" 2>/dev/null || true
