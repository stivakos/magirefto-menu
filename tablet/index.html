<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#141414">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Τελείωσε — Merci Μαγειρευτό</title>
<!--
  ΣΕΛΙΔΑ ΓΙΑ ΤΟ TABLET ΤΟΥ ΜΑΓΑΖΙΟΥ, όχι για τον πελάτη. Δεν υπάρχει σύνδεσμος
  προς τα εδώ από το μενού και είναι noindex.

  Ένα πάτημα = το είδος τελείωσε (κόκκινο). Άλλο ένα = ξανά διαθέσιμο. Μέσα στη
  βάρδια δεν υπάρχει χρόνος για τίποτα παραπάνω: ούτε επιβεβαίωση ούτε
  πληκτρολόγηση.

  Πώς φτάνει στο site: μετά από 2,5'' ησυχίας στέλνει ΟΛΗ τη λίστα στο
  soldout.yml (GitHub Actions), που γράφει το soldout.json. Το site το διαβάζει
  όταν ανοίγει — δεν ξαναχτίζεται. Ο έλεγχος «✓ στο site» συγκρίνει τη λίστα
  του tablet με το δημοσιευμένο soldout.json.

  Η αλήθεια είναι το tablet: η λίστα του μένει στο localStorage, ώστε μια
  επανεκκίνηση πριν ανέβει το προηγούμενο πάτημα να μη το «ξεπατήσει» με την
  παλιά εικόνα του site. Το soldout.json διαβάζεται ως αφετηρία μόνο όταν το
  tablet δεν ξέρει τίποτα για τη σημερινή μέρα.

  ΣΤΑΤΙΚΟ ΑΡΧΕΙΟ — δεν το γράφει το build.py. Το μενού έρχεται από το menu.json.
-->
<style>
  :root{
    --bg:#141414; --ink:#F4F1E8; --gold:#E9C892; --dim:#9d968a;
    --card:#212121; --line:#353535; --red:#C8413A; --red-ink:#fff; --ok:#5DBB7A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{color:var(--ink);font:18px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:0 16px 40px;-webkit-user-select:none;user-select:none;
       -webkit-tap-highlight-color:transparent;}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
         display:flex;align-items:center;gap:12px;flex-wrap:wrap;
         padding:14px 0 12px;border-bottom:1px solid var(--line);}
  h1{font-size:22px;font-weight:700;}
  .date{color:var(--gold);font-size:17px;}
  .status{margin-left:auto;font-size:17px;font-weight:600;padding:8px 14px;border-radius:999px;
          background:var(--card);border:1px solid var(--line);color:var(--dim);}
  .status.ok{color:var(--ok);border-color:#2f5d3c;}
  .status.wait{color:var(--gold);}
  .status.err{color:#fff;background:var(--red);border-color:var(--red);}
  h2{font-size:15px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;
     margin:22px 0 10px;font-weight:700;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
  .tile{position:relative;min-height:84px;padding:12px 14px;border-radius:14px;
        border:2px solid var(--line);background:var(--card);color:var(--ink);
        font-family:inherit;font-size:21px;font-weight:600;line-height:1.25;text-align:left;cursor:pointer;
        display:flex;flex-direction:column;justify-content:center;gap:6px;
        transition:background-color .12s,border-color .12s;}
  .tile:active{transform:scale(.97);}
  .tile .tag{display:none;align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.08em;
             background:rgba(0,0,0,.28);border-radius:999px;padding:3px 9px;}
  .tile.out{background:var(--red);border-color:var(--red);color:var(--red-ink);}
  .tile.out .tag{display:inline-block;}
  /* πατήθηκε αλλά δεν έχει φανεί ακόμη στο site */
  .tile.pending::after{content:"⏳";position:absolute;top:6px;right:8px;font-size:15px;}
  .empty{margin:60px 0;text-align:center;color:var(--dim);font-size:20px;}
  .setup{max-width:560px;margin:30px auto;background:var(--card);border:1px solid var(--line);
         border-radius:14px;padding:20px;-webkit-user-select:text;user-select:text;}
  .setup p{color:var(--dim);font-size:16px;margin-bottom:12px;}
  .setup input{width:100%;font:16px/1.3 ui-monospace,Menlo,monospace;padding:12px;border-radius:10px;
               border:1px solid var(--line);background:#111;color:var(--ink);}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  button.btn{flex:1 1 40%;min-height:52px;border-radius:12px;border:1px solid var(--line);
             background:#2a2a2a;color:var(--ink);font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;}
  button.btn.main{background:var(--gold);border-color:var(--gold);color:#1b1b1b;}
  .msg{margin-top:12px;font-size:16px;min-height:1.3em;}
  .msg.err{color:#ff8a80;} .msg.ok{color:var(--ok);}
  footer{margin-top:34px;display:flex;gap:10px;justify-content:center;}
  footer button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;
                padding:10px 16px;font-family:inherit;font-size:15px;cursor:pointer;}
</style>
</head>
<body>

<header>
  <h1>Τι τελείωσε</h1>
  <span class="date" id="date"></span>
  <span class="status" id="status">Φορτώνει…</span>
</header>

<section class="setup" id="setup" hidden>
  <p><b style="color:var(--ink)">Κλειδί πρόσβασης.</b> Μπαίνει μία φορά σε αυτό το
    tablet. Μπορεί μόνο να σημειώνει τι τελείωσε — δεν αλλάζει μενού ούτε τιμές.</p>
  <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"
         placeholder="github_pat_…">
  <div class="row">
    <button class="btn main" id="saveToken">Αποθήκευση</button>
    <button class="btn" id="cancelToken">Άκυρο</button>
  </div>
  <div class="msg" id="tokenMsg"></div>
</section>

<main id="board"></main>

<footer>
  <button id="reload">↻ Ανανέωση</button>
  <button id="keyBtn">🔑 Κλειδί</button>
</footer>

<script>
(function () {
  "use strict";

  var REPO = "stivakos/magirefto-menu";
  var WORKFLOW = "soldout.yml";
  var API = "https://api.github.com/repos/" + REPO;
  var LS_TOKEN = "merci-tablet-token";
  var LS_STATE = "merci-tablet-state";
  var DEBOUNCE = 2500;        // πολλά πατήματα στη σειρά = ένα αίτημα
  var SLOW = 5 * 60 * 1000;   // τόσο χωρίς να φανεί στο site => κάτι δεν πήγε καλά

  var $ = function (id) { return document.getElementById(id); };
  var board = $("board"), statusEl = $("status");

  var menu = null;            // το menu.json
  var state = null;           // {date, items[], sent, sentAt}
  var siteItems = null;       // ό,τι λέει το δημοσιευμένο soldout.json για σήμερα
  var sendTimer = null, retryTimer = null;
  var lastError = "";

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function token() { return (lsGet(LS_TOKEN) || "").trim(); }
  function save() { lsSet(LS_STATE, JSON.stringify(state)); }
  function fresh(u) { return u + (u.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(); }
  function sig(list) { return (list || []).slice().sort().join(","); }

  function validKeys() {
    var k = {};
    (menu && menu.categories || []).forEach(function (c) {
      c.items.forEach(function (it) { k[c.slug + ":" + it.aa] = true; });
    });
    return k;
  }

  // --- εμφάνιση ------------------------------------------------------------
  function render() {
    board.innerHTML = "";
    if (!menu) return;
    $("date").textContent = menu.closed ? "Κλειστά" : (menu.date || "");
    if (menu.closed || !menu.categories.length) {
      var e = document.createElement("p");
      e.className = "empty";
      e.textContent = menu.closed ? "Το μαγαζί είναι κλειστό — δεν υπάρχει μενού."
                                  : "Δεν υπάρχει μενού για σήμερα.";
      board.appendChild(e);
      return;
    }
    var out = {}, site = {};
    state.items.forEach(function (k) { out[k] = true; });
    (siteItems || []).forEach(function (k) { site[k] = true; });

    menu.categories.forEach(function (c) {
      if (!c.items.length) return;
      var h = document.createElement("h2");
      h.textContent = c.label;
      board.appendChild(h);
      var g = document.createElement("div");
      g.className = "grid";
      // Αλφαβητικά (απόφαση ιδιοκτήτη): μέσα στη βάρδια ψάχνεις το όνομα, όχι
      // τη θέση του στον πίνακα. Τόνοι και κεφαλαία δεν μετράνε στη σειρά.
      c.items.slice().sort(function (a, b) {
        return a.name.localeCompare(b.name, "el", { sensitivity: "base" });
      }).forEach(function (it) {
        var key = c.slug + ":" + it.aa;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tile" + (out[key] ? " out" : "")
          + (siteItems && !!out[key] !== !!site[key] ? " pending" : "");
        var n = document.createElement("span");
        n.className = "name";
        n.textContent = it.name;
        var t = document.createElement("span");
        t.className = "tag";
        t.textContent = "ΤΕΛΕΙΩΣΕ";
        b.appendChild(n); b.appendChild(t);
        b.addEventListener("click", function () { toggle(key); });
        g.appendChild(b);
      });
      board.appendChild(g);
    });
  }

  function showStatus() {
    var cls = "", txt;
    if (!menu) { txt = "Φορτώνει…"; }
    else if (menu.closed) { txt = "Κλειστά"; }
    else if (!token()) { txt = "🔑 Χρειάζεται κλειδί"; cls = "err"; }
    else if (lastError) { txt = "⚠ " + lastError; cls = "err"; }
    else if (!state.sent) { txt = "⏳ Στέλνεται…"; cls = "wait"; }
    else if (siteItems === null || sig(siteItems) !== sig(state.items)) {
      if (state.sentAt && Date.now() - state.sentAt > SLOW) {
        txt = "⚠ Δεν φάνηκε ακόμη στο site"; cls = "err";
      } else { txt = "⏳ Ανεβαίνει στο site…"; cls = "wait"; }
    }
    else { txt = "✓ Όλα στο site"; cls = "ok"; }
    statusEl.textContent = txt;
    statusEl.className = "status " + cls;
  }

  function update() { render(); showStatus(); }

  // --- πάτημα ----------------------------------------------------------------
  function toggle(key) {
    // Πριν διαβαστεί το site, ένα πάτημα θα έσβηνε ό,τι έχει ήδη σημειωθεί.
    if (state.fromSite) return;
    var i = state.items.indexOf(key);
    if (i >= 0) state.items.splice(i, 1); else state.items.push(key);
    state.sent = false;
    save();
    update();
    clearTimeout(sendTimer);
    sendTimer = setTimeout(send, DEBOUNCE);
  }

  function send() {
    clearTimeout(sendTimer); clearTimeout(retryTimer);
    if (!menu || state.sent) return;
    if (!token()) { showStatus(); return; }
    // πιάτο που έφυγε από το μενού μέσα στη μέρα δεν ξαναστέλνεται
    var ok = validKeys();
    state.items = state.items.filter(function (k) { return ok[k]; });
    var body = JSON.stringify({ ref: "main",
      inputs: { date: state.date, items: state.items.slice().sort().join(",") } });
    var sentSig = sig(state.items);
    fetch(API + "/actions/workflows/" + WORKFLOW + "/dispatches", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token(),
                 "Accept": "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28",
                 "Content-Type": "application/json" },
      body: body
    }).then(function (r) {
      if (r.status === 204) {
        lastError = "";
        // Αν πατήθηκε κάτι όσο έφευγε το αίτημα, μένει «προς αποστολή».
        if (sig(state.items) === sentSig) { state.sent = true; state.sentAt = Date.now(); }
        save();
        pollSoon();
      } else if (r.status === 401) {
        lastError = "Το κλειδί έληξε ή είναι λάθος";
      } else if (r.status === 403) {
        lastError = "Το κλειδί δεν έχει δικαίωμα (Actions)";
      } else if (r.status === 404 || r.status === 422) {
        // 404/422 = το GitHub δεν βρίσκει τη ροή soldout.yml στο main (ή το
        // κλειδί δεν βλέπει το repo). Ξαναδοκιμάζει: αν απλώς δεν είχε ανέβει
        // ακόμη, θα περάσει μόνο του μόλις ανέβει.
        lastError = "Το GitHub δεν βρίσκει τη ροή «τελείωσε» — ξαναδοκιμάζει";
        retryTimer = setTimeout(send, 30000);
      } else {
        lastError = "Το GitHub αρνήθηκε (" + r.status + ") — ξαναδοκιμάζει";
        retryTimer = setTimeout(send, 30000);
      }
      update();
      if (!state.sent && !lastError) sendTimer = setTimeout(send, DEBOUNCE);
    }).catch(function () {
      lastError = "Δεν στάλθηκε — χωρίς internet, ξαναδοκιμάζει";
      update();
      retryTimer = setTimeout(send, 20000);
    });
  }

  window.addEventListener("online", function () { if (state && !state.sent) send(); });

  // --- μενού και δημοσιευμένη κατάσταση ------------------------------------
  function loadMenu() {
    return fetch(fresh("../menu.json"), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        var changed = !menu || menu.stamp !== j.stamp || menu.date_iso !== j.date_iso
                      || menu.closed !== j.closed;
        menu = j;
        if (!changed) return;
        var local = null;
        try { local = JSON.parse(lsGet(LS_STATE) || "null"); } catch (e) {}
        if (local && local.date === j.date_iso && Array.isArray(local.items)) {
          state = local;
        } else {
          // Νέα μέρα: η χθεσινή λίστα δεν μεταφέρεται. Αφετηρία = το site.
          state = { date: j.date_iso, items: [], sent: true, fromSite: true };
          save();
        }
        siteItems = null;
        update();
        return loadSite().then(function () { if (!state.sent) send(); });
      })
      .catch(function () {
        if (!menu) { statusEl.textContent = "⚠ Δεν φόρτωσε το μενού — έλεγξε το internet"; statusEl.className = "status err"; }
      });
  }

  function loadSite() {
    return fetch(fresh("../soldout.json"), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : { date_iso: null, items: [] }; })
      .then(function (j) {
        siteItems = (menu && j.date_iso === menu.date_iso && Array.isArray(j.items)) ? j.items : [];
        // Το tablet δεν ήξερε τίποτα για σήμερα (π.χ. καθαρίστηκε): πάρε ό,τι
        // έχει ήδη το site, αντί να το σβήσεις με το πρώτο πάτημα.
        if (state && state.fromSite) {
          delete state.fromSite;
          state.items = siteItems.slice();
          save();
        }
        update();
      })
      .catch(function () {});
  }

  var pollTimer = null;
  function pollSoon() { clearTimeout(pollTimer); pollTimer = setTimeout(poll, 15000); }
  function poll() {
    loadSite().then(function () {
      var waiting = state && (!state.sent || sig(siteItems) !== sig(state.items));
      clearTimeout(pollTimer);
      pollTimer = setTimeout(poll, waiting ? 15000 : 60000);
    });
  }
  setInterval(loadMenu, 60000);             // νέο μενού => αλλάζει μόνο του

  // --- κλειδί ----------------------------------------------------------------
  function openSetup() {
    $("setup").hidden = false;
    $("token").value = "";
    $("tokenMsg").textContent = "";
    $("token").focus();
  }
  $("keyBtn").addEventListener("click", openSetup);
  statusEl.addEventListener("click", function () { if (!token() || /κλειδί/.test(lastError)) openSetup(); });
  $("cancelToken").addEventListener("click", function () { $("setup").hidden = true; });
  $("saveToken").addEventListener("click", function () {
    var t = $("token").value.trim(), msg = $("tokenMsg");
    if (!t) { msg.className = "msg err"; msg.textContent = "Επικόλλησε πρώτα το κλειδί."; return; }
    msg.className = "msg"; msg.textContent = "Δοκιμή…";
    // Ελέγχουμε αμέσως ότι το κλειδί βλέπει το workflow — αλλιώς το λάθος θα
    // φαινόταν μόνο στο πρώτο πάτημα, μέσα στη βάρδια.
    fetch(API + "/actions/workflows/" + WORKFLOW, {
      headers: { "Authorization": "Bearer " + t, "Accept": "application/vnd.github+json" }
    }).then(function (r) {
      if (r.ok) {
        lsSet(LS_TOKEN, t);
        lastError = "";
        msg.className = "msg ok"; msg.textContent = "✓ Το κλειδί δουλεύει.";
        setTimeout(function () { $("setup").hidden = true; }, 900);
        if (state && !state.sent) send();
        showStatus();
      } else {
        msg.className = "msg err";
        msg.textContent = r.status === 401 ? "Λάθος ή ληγμένο κλειδί."
                        : r.status === 404 ? "Δεν βρέθηκε η ροή «τελείωσε»: είτε δεν έχει ανέβει ακόμη ο κώδικας, είτε το κλειδί δεν έχει το repo magirefto-menu."
                        : "Το κλειδί δεν έχει δικαίωμα Actions (" + r.status + ").";
      }
    }).catch(function () {
      msg.className = "msg err"; msg.textContent = "Δεν υπάρχει σύνδεση στο internet.";
    });
  });

  $("reload").addEventListener("click", function () { location.reload(); });

  // --- η οθόνη μένει αναμμένη ------------------------------------------------
  var lock = null;
  function wake() {
    if (!("wakeLock" in navigator) || document.hidden) return;
    navigator.wakeLock.request("screen").then(function (l) { lock = l; }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    wake(); loadMenu(); poll();
  });

  wake();
  loadMenu().then(poll);
  if (!token()) setTimeout(function () { if (!token()) openSetup(); }, 300);
})();
</script>
</body>
</html>
