<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Μαγειρευτό — αλλαγή μενού</title>
<!--
  ΓΡΑΜΜΕΝΟ ΣΤΟ ΧΕΡΙ — δεν το παράγει το build.py, μην περιμένεις να ξαναγραφτεί.

  Γιατί υπάρχει: το github.com σερβίρει web app manifest, οπότε το «Προσθήκη
  στην αρχική οθόνη» του Chrome δεν φτιάχνει συντόμευση προς τη σελίδα που
  βλέπεις — εγκαθιστά το GitHub ως εφαρμογή, που ανοίγει ΠΑΝΤΑ στην αρχική του
  (τη λίστα με τα repos). Καμία αλλαγή στη διεύθυνση δεν το παρακάμπτει.

  Αυτή η σελίδα δεν έχει manifest, άρα το εικονίδιο που φτιάχνεται από εδώ
  είναι σκέτος σύνδεσμος προς αυτό ακριβώς το URL — και από εδώ ανακατευθύνει
  στον editor του menu-today.txt.
-->
<link rel="icon" href="assets/merci-logo.png">
<link rel="apple-touch-icon" href="assets/merci-logo.png">
<meta http-equiv="refresh" content="0; url=https://github.com/stivakos/magirefto-menu/edit/main/menu-today.txt">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.2rem;
    font: 1rem/1.5 system-ui, -apple-system, sans-serif;
    text-align: center; padding: 2rem;
    background: #14110f; color: #f2ece3;
  }
  img { width: 96px; height: auto; border-radius: 50%; }
  a { color: #e5c07b; }
</style>
</head>
<body>
  <img src="assets/merci-logo.png" alt="Merci Μαγειρευτό">
  <p>Ανοίγει το μενού για αλλαγή…</p>
  <p><a href="https://github.com/stivakos/magirefto-menu/edit/main/menu-today.txt">Αν δεν άνοιξε μόνο του, πάτα εδώ</a></p>
  <script>
    // Πριν το meta refresh: replace() ώστε το «πίσω» να μη σε ξαναφέρνει εδώ.
    location.replace("https://github.com/stivakos/magirefto-menu/edit/main/menu-today.txt");
  </script>
</body>
</html>
